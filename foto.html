<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri Foto · Albert Limbong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0d0a; background-image:radial-gradient(ellipse at 50% 30%, rgba(0,255,65,0.06) 0%, transparent 60%); font-family:'Inter',sans-serif; color:#d0e6d0; display:flex; justify-content:center; padding:24px 16px; min-height:100vh; line-height:1.6; }
    .container { max-width:820px; width:100%; background:rgba(8,18,8,0.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-radius:32px; padding:36px 32px; border:1px solid rgba(0,255,65,0.08); box-shadow:0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(0,255,65,0.04) inset; position:relative; overflow:hidden; }
    .container::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle at 40% 30%, rgba(0,255,65,0.02), transparent 60%); pointer-events:none; z-index:0; }
    .container>* { position:relative; z-index:1; }

    .page-header { text-align:center; border-bottom:1px solid rgba(0,255,65,0.06); padding-bottom:20px; margin-bottom:28px; }
    .page-header h1 { font-size:2rem; font-weight:800; color:#00ff41; text-shadow:0 0 20px rgba(0,255,65,0.10); letter-spacing:-0.5px; }
    .page-header .sub { color:#5a8a5a; font-size:0.85rem; margin-top:4px; }
    .back-home { display:inline-block; margin-top:10px; color:#5a8a5a; text-decoration:none; font-size:0.8rem; font-weight:600; transition:0.2s; }
    .back-home:hover { color:#00ff41; }

    .lang-switch { display:flex; justify-content:center; gap:8px; margin-bottom:24px; }
    .lang-btn { background:rgba(0,255,65,0.04); border:1px solid rgba(0,255,65,0.08); color:#6a9a6a; padding:6px 20px; border-radius:40px; font-family:'Inter',sans-serif; font-size:0.75rem; font-weight:600; cursor:pointer; transition:all 0.25s ease; }
    .lang-btn:hover { background:rgba(0,255,65,0.08); color:#a0f0a0; border-color:rgba(0,255,65,0.18); }
    .lang-btn.active { background:linear-gradient(135deg,#00cc33,#00ff41); border-color:transparent; color:#000; box-shadow:0 4px 20px rgba(0,255,65,0.25); font-weight:700; }

    .lang-id { display:block; } .lang-en { display:none; } body.show-en .lang-id { display:none; } body.show-en .lang-en { display:block; }

    .photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:10px; }
    .photo-item { background:rgba(0,255,65,0.02); border:1px solid rgba(0,255,65,0.06); border-radius:16px; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:3rem; transition:all 0.3s ease; color:#3a5a3a; }
    .photo-item:hover { border-color:rgba(0,255,65,0.25); background:rgba(0,255,65,0.04); transform:scale(1.04); }

    .nav-bottom { display:flex; justify-content:center; gap:10px 20px; flex-wrap:wrap; border-top:1px solid rgba(0,255,65,0.05); padding-top:22px; margin-top:28px; }
    .nav-bottom a { color:#5a8a5a; text-decoration:none; font-size:0.75rem; font-weight:500; transition:0.2s; letter-spacing:0.2px; }
    .nav-bottom a:hover { color:#00ff41; transform:translateY(-1px); text-shadow:0 0 20px rgba(0,255,65,0.10); }
    .footer-text { text-align:center; margin-top:26px; font-size:0.7rem; color:#3a5a3a; border-top:1px solid rgba(0,255,65,0.03); padding-top:18px; }

    @media (max-width:600px) { .container { padding:20px 16px; } .photo-grid { grid-template-columns:repeat(2,1fr); gap:12px; } .photo-item { font-size:2.4rem; } }
  </style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>📸 Galeri Foto</h1>
    <div class="sub">
      <span class="lang-id">hasil jepretan</span>
      <span class="lang-en">my captures</span>
    </div>
    <a href="index.html" class="back-home">
      <span class="lang-id">← Kembali ke Beranda</span>
      <span class="lang-en">← Back to Home</span>
    </a>
  </div>

  <div class="lang-switch">
    <button class="lang-btn active" onclick="setLang('id')">🇮🇩 ID</button>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
  </div>

  <div class="photo-grid">
    <div class="photo-item">🌅</div>
    <div class="photo-item">🌿</div>
    <div class="photo-item">🏙️</div>
    <div class="photo-item">🌊</div>
    <div class="photo-item">🎞️</div>
    <div class="photo-item">✨</div>
  </div>
  <p style="text-align:center; color:#4a6a4a; font-size:0.7rem; margin-top:14px;">
    <span class="lang-id">(placeholder — ganti dengan foto asli)</span>
    <span class="lang-en">(placeholder — replace with actual photos)</span>
  </p>

  <div class="nav-bottom">
    <a href="index.html">Home</a>
    <a href="baca.html">Ruang Baca</a>
    <a href="karya.html">E-Book</a>
    <a href="video.html">Video</a>
    <a href="sosmed.html">Sosmed</a>
    <a href="foto.html">Foto</a>
    <a href="music.html">Musik</a>
    <a href="jurnal.html">Jurnal</a>
    <a href="tentang.html">Tentang</a>
  </div>
  <div class="footer-text">Ruang Kreasi · Albert Limbong</div>
</div>
<script>
  function setLang(lang) {
    document.body.classList.remove('show-en');
    if (lang === 'en') document.body.classList.add('show-en');
    document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
    document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  }
</script>
</body>
</html>
